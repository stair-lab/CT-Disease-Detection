# Biomarker Configuration for Comorbidities Detection
# This configuration defines the target variables and their tensor layout

experiment_name: "comorbidities_detection_age_regression"
description: "Multi-task learning for age regression from CT scans"

# Binary classification tasks (output: sigmoid probabilities)
binary_biomarkers: []

# Multiclass classification tasks (output: softmax probabilities)
multiclass_biomarkers: []

# Continuous regression tasks (output: continuous values)
continuous_biomarkers:
  - name: "AGE"
    description: "Patient age in years"
    min_value: 18
    max_value: 89
    normalization: "min_max"  # normalize to [0, 1]

# Data preprocessing settings
preprocessing:
  image_size: 256
  normalize_images: true
  convert_to_rgb: true  # Convert single channel to 3-channel for pretrained models
  
# Training settings
training:
  class_weighting: true  # Use inverse frequency weighting for binary tasks
  balanced_sampling: false  # Don't use balanced sampling (rely on class weighting instead)
  
# Validation settings  
validation:
  # Threshold optimization settings
  threshold_optimization: true
  optimization_metric: "f1_score"  # Metric to optimize thresholds for
  per_biomarker_thresholds: true  # Use different optimal threshold per biomarker
  threshold_search_range: [0.1, 0.9]  # Range to search for optimal thresholds
  threshold_search_steps: 9   # Number of threshold values to test (0.1, 0.2, ..., 0.9)
  fallback_threshold: 0.5  # Default threshold if optimization fails
  
  # Metrics to calculate and log
  metrics:
    - "auroc"
    - "accuracy" 
    - "sensitivity"
    - "specificity"
    - "f1_score"
    - "precision"
    - "recall"
  regression_metrics:
    - "mse"
    - "mae"
    - "r2_score"
